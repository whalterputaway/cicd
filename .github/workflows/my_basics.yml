on:
  workflow_dispatch:

jobs:
  my_build:
    runs-on: linux
    steps:
      - name: copy repos resources
        uses: actions/checkout@v3


  my_test:
    needs: my_build
    runs-on: linux
    steps:
      - name: compose up
        run : docker compose up -d
      - name: check conts
        run: docker ps -a

      

  my_end:
    needs: my_test
    runs-on: linux
    steps:
      - name: terminate all conts
        run: docker compose down
        

